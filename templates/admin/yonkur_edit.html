<!DOCTYPE html>
<html>
<head>


    <title>Yönetim Paneli - {% if member %}Üye Düzenle{% else %}Yeni Üye Ekle{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>{% if member %}Üye Düzenle{% else %}Yeni Üye Ekle{% endif %}</h2>
    <hr>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Grup</label>
            <select name="grup" class="form-select" required>
                <option value="ya" {% if member and member.grup == 'ya' %}selected{% endif %}>Yönetim Kurulu Üyelerimiz</option>
                <option value="yy" {% if member and member.grup == 'yy' %}selected{% endif %}>Yönetim Kurulu Yedek Üyelerimiz</option>
                <option value="da" {% if member and member.grup == 'da' %}selected{% endif %}>Denetleme Kurulu Üyelerimiz</option>
                <option value="dy" {% if member and member.grup == 'dy' %}selected{% endif %}>Denetleme Kurulu Yedek Üyelerimiz</option>
                <option value="br" {% if member and member.grup == 'br' %}selected{% endif %}>Başkanlık ve Birimler</option>
                <option value="is" {% if member and member.grup == 'is' %}selected{% endif %}>Yüksek İstişare ve Onur Kurulu</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">İsim</label>
            <input type="text" name="name" class="form-control" value="{% if member %}{{ member.name }}{% endif %}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Ünvan (Görev)</label>
            <input type="text" name="unvan" class="form-control" value="{% if member %}{{ member.unvan }}{% endif %}">
        </div>
        <div class="mb-3">
            <label class="form-label">Sıra Numarası (Sıralama için)</label>
            <input type="number" name="ordernum" class="form-control" value="{% if member %}{{ member.ordernum }}{% else %}100{% endif %}">
        </div>
        <div class="mb-3">
            <label class="form-label">Fotoğraf</label>
            {% if member and member.image_path %}
                <div class="mb-2">
                    <img src="/{{ member.image_path }}" style="width:100px; height:100px; border-radius:50%; object-fit:cover;">
                </div>
            {% endif %}
            <input type="file" name="file" class="form-control" accept="image/*">
            <small class="text-muted">Yeni fotoğraf seçerseniz eskisiyle değişir. Boş bırakırsanız mevcut fotoğraf kalır.</small>
        </div>
        
        <button type="submit" class="btn btn-success">Kaydet</button>
        <a href="{{ url_for('admin_yonkur') }}" class="btn btn-secondary">İptal</a>
    </form>
</div>
</body>
</html>
