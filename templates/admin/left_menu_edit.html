<!DOCTYPE html>
<html>
<head>


    <title>Sol Menü Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Sol Menü Düzenle</h2>
    <hr>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Başlık</label>
                    <input type="text" name="title" class="form-control" required value="{{ menu.title }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Link (URL)</label>
                    <input type="text" name="url" class="form-control" required value="{{ menu.url }}">
                </div>
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{{ url_for('admin_left_menu') }}" class="btn btn-secondary">İptal</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
