{% extends "admin/base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <h1 class="page-header">Admin Giriş Bilgileri Değiştirme</h1>
    </div>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="panel panel-default">
            <div class="panel-heading">
                Kullanıcı Adı ve Şifre Güncelle
            </div>
            <div class="panel-body">
                <form role="form" method="POST" action="/admin/password">
                    <div class="form-group">
                        <label>Yeni Kullanıcı Adı</label>
                        <input class="form-control" name="username" value="{{ username }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Yeni Şifre</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
