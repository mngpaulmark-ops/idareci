<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Duyuru Düzenle' if duyuru else 'Duyuru Ekle' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>{{ 'Duyuru Düzenle' if duyuru else 'Duyuru Ekle' }}</h2>
    
    <form method="POST">
        <div class="mb-3">
            <label>Başlık</label>
            <input type="text" name="title" class="form-control" value="{{ duyuru.title if duyuru else '' }}" required>
        </div>
        <div class="mb-3">
            <label>Link (İsteğe Bağlı)</label>
            <input type="text" name="link" class="form-control" value="{{ duyuru.link if duyuru else '' }}">
            <small class="text-muted">Örnek: /haber/123-deneme.html veya https://google.com</small>
        </div>
        
        <button type="submit" class="btn btn-primary">Kaydet</button>
        <a href="{{ url_for('admin_duyuru') }}" class="btn btn-secondary">İptal</a>
    </form>
</div>
</body>
</html>
