<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>Köşe Yazıları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
    <script>tinymce.init({selector:'textarea'});</script>
</head>
<body>
<div class="container mt-5 mb-5">
    <h2>Köşe Yazıları Yönetimi</h2>
    <hr>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header bg-primary text-white">Yeni Yazar Ekle</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_yazar_ekle') }}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label>Yazar Adı</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Kullanıcı Adı (Giriş için)</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Şifre (Giriş için)</label>
                            <input type="text" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Fotoğraf</label>
                            <input type="file" name="image" class="form-control">
                        </div>
                        <button class="btn btn-primary w-100">Yazar Ekle</button>
                    </form>
                </div>
            </div>
            
            <a href="{{ url_for('admin_index') }}" class="btn btn-secondary w-100">Geri Dön</a>
        </div>
        
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header bg-success text-white">Yeni Köşe Yazısı Ekle</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_kose_ekle') }}">
                        <div class="mb-3">
                            <label>Yazar Seçin</label>
                            <select name="yazar_id" class="form-control" required>
                                {% for y in yazarlar %}
                                <option value="{{ y.id }}">{{ y.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Yazı Başlığı</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>İçerik</label>
                            <textarea name="content" class="form-control" rows="5"></textarea>
                        </div>
                        <button class="btn btn-success w-100">Yazıyı Yayınla</button>
                    </form>
                </div>
            </div>
            
            <h4>Mevcut Yazılar</h4>
            <ul class="list-group">
                {% for yazi in yazilar %}
                <li class="list-group-item d-flex justify-content-between">
                    <div>
                        <strong>{{ yazi.title }}</strong> <br>
                        <small class="text-muted">{{ yazi.yazar.name }} | {{ yazi.date_added.strftime('%d.%m.%Y') if yazi.date_added else '' }}</small>
                    </div>
                    <a href="{{ url_for('admin_kose_edit', id=yazi.id) }}" class="btn btn-sm btn-primary">Düzenle</a>
                                    <form action="{{ url_for('admin_kose_sil', id=yazi.id) }}" method="POST" onsubmit="return confirm('Silmek istediğinize emin misiniz?');">
                        <button class="btn btn-danger btn-sm">Sil</button>
                    </form>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
</body>
</html>
