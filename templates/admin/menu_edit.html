<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>Menü Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Menü Düzenle</h2>
    <hr>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Başlık</label>
                    <input type="text" name="title" class="form-control" required value="{{ menu.title }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Link (URL)</label>
                    <input type="text" name="url" class="form-control" required value="{{ menu.url }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Üst Menü</label>
                    <select name="parent_id" class="form-control">
                        <option value="0">--- Ana Menü Olsun ---</option>
                        {% for m in menus %}
                        {% if m.id != menu.id %}
                        <option value="{{ m.id }}" {% if menu.parent_id == m.id %}selected{% endif %}>{{ m.title }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{{ url_for('admin_menu') }}" class="btn btn-secondary">İptal</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
