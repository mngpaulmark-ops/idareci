<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>Admin Hesap Ayarları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Admin Giriş Bilgilerini Değiştir</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label>Yeni Kullanıcı Adı</label>
                    <input type="text" name="username" class="form-control" value="{{ u }}" required>
                </div>
                <div class="mb-3">
                    <label>Yeni Şifre</label>
                    <input type="text" name="password" class="form-control" value="{{ p }}" required>
                </div>
                <button class="btn btn-danger w-100 mb-2">Güncelle ve Yeniden Giriş Yap</button>
            </form>
            <a href="{{ url_for('admin_index') }}" class="btn btn-secondary w-100">İptal / Geri Dön</a>
        </div>
    </div>
</div>
</body>
</html>
