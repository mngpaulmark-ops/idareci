<!DOCTYPE html>
<html>
<head>


    <title>Haber Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Haber Yönetimi</h2>
    <hr>
    <a href="{{ url_for('admin_index') }}" class="btn btn-secondary mb-3">Panele Dön</a>
    <a href="{{ url_for('admin_haber_add') }}" class="btn btn-primary mb-3">Yeni Haber Ekle</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tarih</th>
                <th>Resim</th>
                <th>Başlık</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody>
            {% for haber in habers %}
            <tr>
                <td>{{ haber.id }}</td>
                <td>{{ haber.date.strftime('%d.%m.%Y') }}</td>
                <td>
                    {% if haber.image_path %}
                    <img src="/{{ haber.image_path }}" style="width:100px; border-radius:5px;">
                    {% else %}
                    Yok
                    {% endif %}
                </td>
                <td>{{ haber.title }}</td>
                <td>
                    <a href="{{ url_for('admin_haber_edit', id=haber.id) }}" class="btn btn-sm btn-warning">Düzenle</a>
                    <form action="{{ url_for('admin_haber_delete', id=haber.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Bu haberi silmek istediğinize emin misiniz? (Haberin HTML dosyası da silinir)');">
                        <button type="submit" class="btn btn-sm btn-danger">Sil</button>
                    </form>
                    <a href="/haber/{{ haber.id }}-{{ haber.slug }}.html" target="_blank" class="btn btn-sm btn-info">Görüntüle</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
