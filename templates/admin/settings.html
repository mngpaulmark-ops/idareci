<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>Genel Ayarlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5">
    <h2>Genel Ayarlar</h2>
    <hr>
    
    <div class="alert alert-info">
        Bu alandaki değişiklikler, kaydedildiği anda sistemdeki <strong>tüm HTML sayfalarında</strong> (tüm haberler, sayfalar ve ana sayfa dahil) otomatik olarak güncellenir.
    </div>

    <form method="POST">
        {% for key, s in settings.items() %}
        <div class="mb-3">
            <label class="form-label fw-bold">{{ s.label }}</label>
            <input type="text" name="{{ key }}" class="form-control" value="{{ s.value }}">
        </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-success mt-3">Kaydet ve Tüm Sayfalara Uygula</button>
        <a href="{{ url_for('admin_index') }}" class="btn btn-secondary mt-3">İptal / Geri Dön</a>
    </form>
</div>
</body>
</html>
