<!DOCTYPE html>
<html>
<head>


    <title>Galeri Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5">
    <h2>Galeri Yönetimi</h2>
    <hr>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header bg-primary text-white">Yeni Galeri Oluştur</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_galeri_ekle') }}">
                        <div class="mb-3">
                            <label>Galeri Adı (Başlık)</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <button class="btn btn-primary w-100">Oluştur</button>
                    </form>
                </div>
            </div>
            
            <a href="{{ url_for('admin_index') }}" class="btn btn-secondary w-100">Geri Dön</a>
        </div>
        
        <div class="col-md-8">
            <h4>Mevcut Galeriler</h4>
            <div class="list-group">
                {% for g in galeriler %}
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('admin_galeri_edit', id=g.id) }}" class="text-decoration-none flex-grow-1 text-dark fw-bold">
                        {{ g.title }}
                        <span class="badge bg-secondary rounded-pill ms-2">{{ g.resimler|length }} Resim</span>
                    </a>
                    <div>
                        <a href="{{ url_for('admin_galeri_edit', id=g.id) }}" class="btn btn-sm btn-primary me-1">📷 Resim Ekle / Düzenle</a>
                        <form method="POST" action="{{ url_for('admin_galeri_sil', id=g.id) }}" style="display:inline;" onsubmit="return confirm('Bu galeriyi ve içindeki tüm resimleri silmek istediğinize emin misiniz?');">
                            <button type="submit" class="btn btn-sm btn-danger">Sil</button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
