<!DOCTYPE html>
<html>
<head>


    <title>Yazar Paneli: {{ yazar.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
    <script>tinymce.init({selector:'textarea'});</script>
</head>
<body>
<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Hoş Geldiniz, {{ yazar.name }}</h2>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Çıkış Yap</a>
    </div>
    <hr>
    
    <div class="row">
        <div class="col-md-5">
            <div class="card mb-3">
                <div class="card-header bg-success text-white">Yeni Köşe Yazısı Ekle</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('yazar_panel_ekle') }}">
                        <div class="mb-3">
                            <label>Yazı Başlığı</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>İçerik</label>
                            <textarea name="content" class="form-control" rows="10"></textarea>
                        </div>
                        <button class="btn btn-success w-100">Yayınla</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-7">
            <h4>Yazılarım</h4>
            <ul class="list-group">
                {% for yazi in yazilar %}
                <li class="list-group-item d-flex justify-content-between">
                    <div>
                        <strong>{{ yazi.title }}</strong> <br>
                        <small class="text-muted">{{ yazi.date_added.strftime('%d.%m.%Y') if yazi.date_added else '' }}</small>
                    </div>
                    <form action="{{ url_for('yazar_panel_sil', id=yazi.id) }}" method="POST" onsubmit="return confirm('Silmek istediğinize emin misiniz?');">
                        <button class="btn btn-danger btn-sm">Sil</button>
                    </form>
                </li>
                {% else %}
                <li class="list-group-item text-muted">Henüz hiç yazı eklemediniz.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
</body>
</html>
