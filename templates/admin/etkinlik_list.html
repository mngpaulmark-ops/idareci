<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>Etkinlikler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5">
    <h2>Etkinlik Yönetimi</h2>
    <hr>
    <div class="mb-3">
        <a href="{{ url_for('admin_index') }}" class="btn btn-secondary">Admin Panele Dön</a>
        <a href="{{ url_for('admin_etkinlik_ekle') }}" class="btn btn-success">Yeni Etkinlik Ekle</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tarih</th>
                <th>Saat</th>
                <th>Başlık</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody>
            {% for e in etkinlikler %}
            <tr>
                <td>{{ e.id }}</td>
                <td>{{ e.edate }}</td>
                <td>{{ e.saat }}</td>
                <td>{{ e.title }}</td>
                <td>
                    <a href="{{ url_for('admin_etkinlik_edit', id=e.id) }}" class="btn btn-sm btn-primary">Düzenle</a>
                    <form action="{{ url_for('admin_etkinlik_sil', id=e.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Silmek istediğinize emin misiniz?')">Sil</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
