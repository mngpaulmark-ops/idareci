<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />
    <title>{% if etkinlik %}Etkinlik Düzenle{% else %}Yeni Etkinlik Ekle{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{% if etkinlik %}Etkinlik Düzenle{% else %}Yeni Etkinlik Ekle{% endif %}</h2>
        <a href="{{ url_for('admin_etkinlik') }}" class="btn btn-secondary">Geri Dön</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Tarih (Zaman damgası örneğin 1457179200000 veya metin)</label>
                    <input type="text" name="edate" class="form-control" value="{{ etkinlik.edate if etkinlik else '' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Saat (Örn: 14:00)</label>
                    <input type="text" name="saat" class="form-control" value="{{ etkinlik.saat if etkinlik else '' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Başlık</label>
                    <input type="text" name="title" class="form-control" value="{{ etkinlik.title if etkinlik else '' }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Açıklama</label>
                    <textarea name="description" class="form-control" rows="5">{{ etkinlik.description if etkinlik else '' }}</textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Kaydet</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
