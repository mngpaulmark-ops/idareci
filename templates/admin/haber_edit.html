<!DOCTYPE html>
<html>
<head>
    <title>Yönetim Paneli - {% if haber %}Haber Düzenle{% else %}Yeni Haber Ekle{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
      tinymce.init({
        selector: '#content',
        plugins: 'image link media table lists',
        toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image media | table',
        images_upload_url: '/admin/upload',
        height: 500
      });
    </script>
</head>
<body>
<div class="container mt-5 mb-5">
    <h2>{% if haber %}Haber Düzenle{% else %}Yeni Haber Ekle{% endif %}</h2>
    <hr>
    
    <form method="POST" enctype="multipart/form-data">
        
            <div class="mb-3">
                <label class="form-label">Tarih</label>
                <input type="date" name="date" class="form-control" value="{{ haber.date.strftime('%Y-%m-%d') if haber and haber.date else '' }}" required>
            </div>
            <div class="mb-3">

            <label class="form-label">Haber Başlığı</label>
            <input type="text" name="title" class="form-control" value="{% if haber %}{{ haber.title }}{% endif %}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Ana Fotoğraf (Manşet ve Haber içi)</label>
            {% if haber and haber.image_path %}
                <div class="mb-2">
                    <img src="/{{ haber.image_path }}" style="width:200px; border-radius:5px;">
                </div>
            {% endif %}
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <div class="mb-3">
            <label class="form-label">Haber İçeriği</label>
            <textarea id="content" name="content">{% if haber %}{{ haber.content }}{% endif %}</textarea>
        </div>
        
        <button type="submit" class="btn btn-success">Kaydet ve Yayınla</button>
        <a href="{{ url_for('admin_haber') }}" class="btn btn-secondary">İptal</a>
    </form>
</div>
</body>
</html>
