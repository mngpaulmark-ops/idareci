<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Galeri Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>Galeri Düzenle</h3>
            <div class="card shadow-sm p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label>Galeri Baþlýðý</label>
                        <input type="text" name="title" class="form-control" value="{{ galeri.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Tarih (Ýsteðe baðlý)</label>
                        <input type="text" name="date" class="form-control" value="{{ galeri.date or '' }}">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Kaydet</button>
                    <a href="{{ url_for('admin_galeri') }}" class="btn btn-secondary w-100 mt-2">Ýptal</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
