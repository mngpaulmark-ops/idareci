<!DOCTYPE html>
<html>
<head>
<base href="/idareci/" />

    <title>{% if rep %}Temsilcilik Düzenle{% else %}Yeni Temsilcilik Ekle{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5" style="max-width: 600px;">
    <h2>{% if rep %}Temsilcilik Düzenle{% else %}Yeni Temsilcilik Ekle{% endif %}</h2>
    <hr>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Şehir (İl)</label>
            <select name="city_code" class="form-control" required>
                <option value="">Seçiniz...</option>
                {% for code, name in cities.items() %}
                <option value="{{ code }}" {% if rep and rep.city_code == code %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Temsilci Adı Soyadı</label>
            <input type="text" name="name" class="form-control" required value="{{ rep.name if rep else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Telefon Numarası</label>
            <input type="text" name="phone" class="form-control" value="{{ rep.phone if rep else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Temsilci Resmi (Opsiyonel)</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            {% if rep and rep.image_path %}
            <div class="mt-2">
                <img src="/{{ rep.image_path }}" width="80" style="border-radius:10px;">
                <br><small>Mevcut Resim</small>
            </div>
            {% endif %}
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Kaydet</button>
            <a href="{{ url_for('admin_temsilcilik') }}" class="btn btn-secondary">İptal</a>
        </div>
    </form>
</div>
</body>
</html>
